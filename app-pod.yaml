apiVersion: v1
kind: Namespace
metadata:
  name: optracard-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optracard-backend-deployment
  namespace: optracard-backend
  labels:
    app: optracard-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: optracard-backend
  template:
    metadata:
      labels:
        app: optracard-backend
    spec:
      containers:
        - name: optracard-backend-container
          image: saksitboom/optracard-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: optracard-backend-service
  namespace: optracard-backend
spec:
  type: NodePort
  selector:
    app: optracard-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081