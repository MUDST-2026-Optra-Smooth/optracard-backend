apiVersion: v1
kind: Namespace
metadata:
  name: optracard-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optracard-backend-deployment
  namespace: optracard-backend
  labels:
    app: optracard-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: optracard-backend
  template:
    metadata:
      labels:
        app: optracard-backend
    spec:
      containers:
        - name: optracard-backend-container
          image: saksitboom/optracard-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/optracard"
            - name: SPRING_DATASOURCE_USERNAME
              value: "admin"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "password"
            - name: JWT_SECRET
              value: "optracard-k8s-jwt-secret-replace-in-production-at-least-32-bytes"
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: optracard-backend-service
  namespace: optracard-backend
spec:
  type: NodePort
  selector:
    app: optracard-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081
