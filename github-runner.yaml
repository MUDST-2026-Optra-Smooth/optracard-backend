apiVersion: v1
kind: Namespace
metadata:
  name: github-runner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner-sa
  namespace: github-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-runner-cluster-admin
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-runner-cluster-admin-binding
subjects:
  - kind: ServiceAccount
    name: github-runner-sa
    namespace: github-runner
roleRef:
  kind: ClusterRole
  name: github-runner-cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: github-runner-secret
  namespace: github-runner
type: Opaque
stringData:
  # Target repository URL
  REPO_URL: "https://github.com/MUDST-2026-Optra-Smooth/optracard-backend"
  # Obtain a registration token from:
  # https://github.com/MUDST-2026-Optra-Smooth/optracard-backend/settings/actions/runners/new
  RUNNER_TOKEN: "REPLACE_WITH_GITHUB_RUNNER_TOKEN"
  RUNNER_NAME: "k8s-optracard-runner"
  LABELS: "self-hosted,linux,k8s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: github-runner
  labels:
    app: github-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: github-runner-sa
      containers:
        - name: runner
          image: myoung34/github-runner:latest
          env:
            - name: REPO_URL
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: REPO_URL
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: RUNNER_TOKEN
            - name: RUNNER_NAME
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: RUNNER_NAME
            - name: LABELS
              valueFrom:
                secretKeyRef:
                  name: github-runner-secret
                  key: LABELS
            - name: RUNNER_WORKDIR
              value: "/tmp/runner/work"
            - name: EPHEMERAL
              value: "false"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
