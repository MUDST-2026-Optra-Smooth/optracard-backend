global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'optracard-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080', 'host.docker.internal:8080']

