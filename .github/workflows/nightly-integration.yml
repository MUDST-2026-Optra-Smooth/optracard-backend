name: Backend nightly integration

on:
  schedule:
    - cron: '30 18 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-contract:
    name: PostgreSQL Testcontainers contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run full suite with PostgreSQL contract tests
        env:
          RUN_POSTGRES_TESTS: 'true'
          RUN_AUCTION_POSTGRES_TESTS: 'true'
        run: mvn --batch-mode --no-transfer-progress clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-jacoco-and-surefire
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: error
          retention-days: 14
