name: Optracard-Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, Test, and Generate Coverage Report
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload Surefire Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Validate Docker Container Build
        run: docker build -t optracard-backend:test .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Kubernetes Manifests
        run: |
          pip install pyyaml
          python -c "import yaml; docs = list(yaml.safe_load_all(open('app-pod.yaml'))); kinds = {doc['kind'] for doc in docs if doc}; required = {'Namespace', 'ConfigMap', 'Secret', 'PersistentVolumeClaim', 'Deployment', 'Service'}; assert required <= kinds, f'Missing: {required-kinds}'; print(f'Validated {len(docs)} Kubernetes manifests successfully')"

  deploy:
    name: Build, Push & Deploy Backend
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/optracard-backend:${{ github.sha }}" .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/optracard-backend:${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Configure Kubernetes access
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          if (-not $env:KUBECONFIG_BASE64) {
            Write-Host "::error::Missing GitHub Secret KUBECONFIG_BASE64. Add it in Settings > Secrets and variables > Actions."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "$HOME\.kube" | Out-Null
          [IO.File]::WriteAllBytes("$HOME\.kube\config", [Convert]::FromBase64String($env:KUBECONFIG_BASE64.Trim()))

      - name: Apply manifest and roll out backend
        run: |
          kubectl apply -f app-pod.yaml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl set image deployment/optracard-backend-deployment optracard-backend-container="${{ secrets.DOCKERHUB_USERNAME }}/optracard-backend:${{ github.sha }}" -n optracard-backend
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl rollout status deployment/optracard-postgres -n optracard-backend --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit 1 }
          kubectl rollout status deployment/optracard-backend-deployment -n optracard-backend --timeout=600s
          if ($LASTEXITCODE -ne 0) { exit 1 }
