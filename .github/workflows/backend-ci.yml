name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & Validate
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Add Maven to PATH
        run: echo "C:\Users\Acer\apache-maven-3.9.9\bin" >> $env:GITHUB_PATH

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build, Test, and Generate Coverage Report
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload Surefire Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Validate Docker Container Build
        run: docker build -t optracard-backend:test .

      - name: Validate Kubernetes Manifests
        run: |
          python -c "import yaml; docs = list(yaml.safe_load_all(open('app-pod.yaml'))); kinds = {doc['kind'] for doc in docs if doc}; required = {'Namespace', 'ConfigMap', 'Secret', 'PersistentVolumeClaim', 'Deployment', 'Service'}; assert required <= kinds, f'Missing: {required-kinds}'; print(f'Validated {len(docs)} Kubernetes manifests successfully')"

  deploy:
    name: Build, Push & Deploy Backend
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        shell: bash
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/optracard-backend:${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/optracard-backend:${{ github.sha }}

      - name: Configure Kubernetes access
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KUBECONFIG_BASE64" ]; then
            echo "::error::Missing GitHub Secret KUBECONFIG_BASE64. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_BASE64" | base64 --decode > "$HOME/.kube/config"

      - name: Apply manifest and roll out backend
        shell: bash
        run: |
          kubectl apply -f app-pod.yaml
          kubectl set image deployment/optracard-backend-deployment \
            optracard-backend-container=${{ secrets.DOCKERHUB_USERNAME }}/optracard-backend:${{ github.sha }} \
            -n optracard-backend
          kubectl rollout status deployment/optracard-postgres -n optracard-backend --timeout=180s
          kubectl rollout status deployment/optracard-backend-deployment -n optracard-backend --timeout=180s