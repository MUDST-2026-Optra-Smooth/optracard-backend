# Keep small schema additions (such as marketplace listing approval status) in
# sync when an existing PostgreSQL database is reused.
spring.jpa.hibernate.ddl-auto=update

# Return safe, user-facing reasons from API validation errors. For example, the
# cart can tell the buyer when the requested quantity exceeds available stock.
server.error.include-message=always

# ป้องกัน DoS จากการอัปโหลดหรือส่งข้อมูลขนาดใหญ่เกินความจำเป็น
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB

# ป้องกันการเปิด Connection ค้างไว้เพื่อโจมตีแบบ Slowloris
server.tomcat.connection-timeout=10000

# Springdoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ===================================================================
# Observability & Metrics (Prometheus, Tempo, Loki)
# ===================================================================
spring.application.name=optracard-backend
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=optracard-backend
management.tracing.sampling.probability=1.0
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
management.otlp.tracing.endpoint=${TEMPO_URL:http://localhost:4318/v1/traces}
loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}
