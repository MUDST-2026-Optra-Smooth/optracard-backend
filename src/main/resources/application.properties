spring.profiles.active=local

# Local development keeps small schema additions (such as marketplace listing
# approval status) in sync when an existing PostgreSQL database is reused.
spring.jpa.hibernate.ddl-auto=update

# Return safe, user-facing reasons from API validation errors. For example, the
# cart can tell the buyer when the requested quantity exceeds available stock.
server.error.include-message=always

# ป้องกัน DoS จากการอัปโหลดหรือส่งข้อมูลขนาดใหญ่เกินความจำเป็น
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB

# ป้องกันการเปิด Connection ค้างไว้เพื่อโจมตีแบบ Slowloris
server.tomcat.connection-timeout=10000
