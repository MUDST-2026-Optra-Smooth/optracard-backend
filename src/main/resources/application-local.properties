spring.datasource.url=jdbc:postgresql://localhost:5432/optracard
spring.datasource.username=admin
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Keep the signing key stable across backend restarts so existing login tokens remain valid.
# Override this with JWT_SECRET in deployed environments.
jwt.secret=${JWT_SECRET:optracard-local-jwt-secret-change-this-value}
